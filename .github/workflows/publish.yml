name: publish

# Releases come from a version tag on main, nowhere else:
#
#   git tag -a v0.3.1 origin/main -m v0.3.1 && git push origin v0.3.1
#
# What a tag push runs, in order:
#   verify   the tag is exactly `v` + the version in agentchatme_hermes/_version.py,
#            both plugin.yaml files carry the same version, and the tagged
#            commit is on main. Anything else stops the release here.
#   test     the full CI gate on the tagged commit (ruff, mypy, pytest;
#            3.9–3.13 on Linux, 3.12 on macOS and Windows). Prior CI status
#            on the branch is not trusted.
#   build    sdist + wheel, built once, `twine check`ed, kept as an artifact.
#   publish  waits in the `pypi` environment for the maintainer's approval,
#            then uploads exactly that artifact.
#
# Auth is PyPI trusted publishing (OIDC). There is NO PyPI token in repo
# secrets: PyPI trusts this repository + this workflow file (publish.yml) +
# the `pypi` environment and mints a short-lived token for the one upload.
# The publish action also attaches PEP 740 attestations (provenance).
# PyPI side: https://pypi.org/manage/project/agentchatme-hermes/settings/publishing/
#   GitHub publisher: owner agentchatme, repository agentchat-hermes,
#   workflow publish.yml, environment pypi.
#
# `workflow_dispatch` runs verify (minus the tag check), test and build — a
# dry run of the pipeline itself. It never uploads.
#
# Actions are pinned to commits (the version is in the trailing comment) so
# an upstream change cannot alter a release step; bump them deliberately.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag matches the package version; the commit is on main
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          module = re.search(r'^__version__\s*=\s*"([^"]+)"', open("agentchatme_hermes/_version.py", encoding="utf-8").read(), re.M)
          problems = []
          if not module:
              problems.append("could not read __version__ from agentchatme_hermes/_version.py")
          else:
              version = module.group(1)
              for path in ("plugin.yaml", "agentchatme_hermes/plugin.yaml"):
                  found = re.search(r'^version:\s*["\']?([^"\'\s]+)', open(path, encoding="utf-8").read(), re.M)
                  if not found or found.group(1) != version:
                      problems.append(f"{path} says {found.group(1) if found else 'no version'} but _version.py says {version}")
              if os.environ["EVENT"] == "push":
                  tag = os.environ["GITHUB_REF_NAME"]
                  if tag != f"v{version}":
                      problems.append(f"tag {tag} does not match the package version {version} (expected v{version})")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
          if [ "$EVENT" = "push" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_SHA is not on main; releases are cut from main only"
              exit 1
            fi
          fi

  test:
    needs: verify
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Same matrix as ci.yml. ubuntu-24.04, not ubuntu-latest: 26.04 has
        # no actions/setup-python build of 3.9.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy agentchatme_hermes
      - name: Test (pytest)
        run: pytest -ra --cov=agentchatme_hermes --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Show built artefacts
        run: ls -lh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/agentchatme-hermes
    permissions:
      id-token: write # OIDC exchange with PyPI (trusted publishing); nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # Slack, same routing as the Python SDK. Fail-safe: without the
  # SLACK_WEBHOOK_WARNING secret these log a warning and pass.
  notify-awaiting-tap:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":hourglass_flowing_sand: *agentchatme-hermes (PyPI) release awaiting your approval* (`${{ github.ref_name }}` → pypi gate). Tap it here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -sS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true

  notify-failure:
    needs: [verify, test, build, publish]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":warning: *agentchatme-hermes (PyPI) publish pipeline failed* on `${{ github.ref_name }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped"; exit 0; fi
          printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -sS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
