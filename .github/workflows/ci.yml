name: ci

on:
  push:
    branches: [main, legacy-0.1.x]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to 26.04 (Nov 2026), where
        # actions/setup-python has no 3.9 build; 24.04 carries 3.9–3.13.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Smoke matrix on macOS + Windows — one Python each, just to
          # catch OS-specific surprises (path separators, file encoding,
          # daemon-thread shutdown semantics). Linux carries the full
          # version spread.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy agentchatme_hermes

      - name: Test (pytest)
        run: pytest -ra --cov=agentchatme_hermes --cov-report=term-missing

  # Secret scan of the new commits only: the pull request's range, or the
  # push's. The default gitleaks rules plus the AgentChat API key rule
  # (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Checksum-pinned, cached: a download happens only on a cache miss
      # (.github/actions/install-pinned-binary).
      - uses: ./.github/actions/install-pinned-binary
        with:
          name: gitleaks
          version: 8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      - name: Select commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "range=${HEAD_SHA}^..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --log-opts="${{ steps.commits.outputs.range }}"
          .
