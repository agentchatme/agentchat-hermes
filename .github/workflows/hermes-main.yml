name: hermes-main

# The test suite against Hermes Agent, every night: its main branch, its
# latest release and the oldest release this plugin accepts (the floor).
#
# The CI gate (ci.yml) runs without Hermes installed: Hermes is stubbed, so it
# proves this package, not that Hermes still has what the package imports.
# This workflow installs hermes-agent exactly the way Hermes' own CI does
# (`uv sync --locked` from its uv.lock, Python 3.14), adds this package to
# that environment, and runs the whole suite. With Hermes present the
# contract tests in tests/test_hermes_contract.py run too: every internal
# surface the plugin touches (docs/hermes-coupling.md), plus a real AIAgent
# turn stopped by the time limit and a real ctx.llm call, both against a
# localhost model stub.
#
# Each leg also runs Hermes' own install-time security scan (the functions
# `hermes plugins install` calls, .github/scripts/hermes-install-scan.py) on this
# tree as a clone holds it, and the skill-install scan on the manual
# https://agentchat.me/skill.md serves now: a `dangerous` verdict, which Hermes
# refuses even with --force, fails the leg; every critical and high finding is
# printed. Both run even when the tests failed.
#
# Three legs. `main`: a red leg means Hermes main changed something the next
# Hermes release would break here. `latest release`: the newest hermes-agent
# release that is neither a draft nor a pre-release, looked up at run time
# from its GitHub releases — what users run today; a red leg means this
# package's main fails on it. `floor`: the release `requires_hermes` in
# plugin.yaml names (">=0.23.2" → v0.23.2), the oldest one Hermes loads the
# plugin on; a red leg means the floor is no longer true. It is left out when
# it is the latest release. Nothing is published or changed.
#
# Alerting: a red scheduled run opens one issue, or comments on the open one,
# and the next green scheduled run closes it (.github/scripts/nightly-issue.sh,
# with the GITHUB_TOKEN; no secret needed). A dispatch reports only with
# report_issue, to its own "dispatch test" issue, so it never closes the real
# one. Slack is an extra channel that does nothing until a
# SLACK_WEBHOOK_WARNING secret exists.
#
# If the latest release cannot be looked up, or plugin.yaml names no floor,
# `main` is still tested and that leg fails, so the night is red rather than
# empty.
#
# Actions are pinned to commits (the version is in the trailing comment), as
# in publish.yml. setup-uv and the uv version are the ones Hermes' tests.yml
# pins.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "hermes-agent branch, tag or commit to test against (empty: main and the latest release)"
        required: false
        default: ""
      report_issue:
        description: "Open, update or close the nightly issue for this run, as a scheduled run does"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Per event and ref: a dispatch never cancels the scheduled run (and its
# report), and a dispatch on a branch never cancels one on main.
concurrency:
  group: hermes-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    name: Resolve hermes-agent refs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: plugin.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: main, the latest release and the floor, or the ref asked for
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.hermes_ref }}
        run: |
          set -euo pipefail
          ref_shape='^[A-Za-z0-9][A-Za-z0-9._/+-]*$'
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ $ref_shape ]]; then
              echo "::error::hermes_ref must be a branch, tag or commit name, got '$REQUESTED'"
              exit 1
            fi
            matrix=$(jq -cn --arg ref "$REQUESTED" '{include: [{ref: $ref, leg: "requested"}]}')
          else
            # An empty ref makes the release leg fail at its first step, so a
            # failed lookup still tests main and still turns the night red.
            latest=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name) || latest=""
            if ! [[ "$latest" =~ $ref_shape ]]; then
              echo "::warning::hermes-agent's latest release could not be looked up (got '$latest')"
              latest=""
            else
              echo "hermes-agent latest release: $latest"
            fi
            # The floor: requires_hermes in plugin.yaml, ">=X.Y.Z" → tag vX.Y.Z.
            # An empty ref fails that leg at its first step, like the release leg.
            floor=$(sed -n 's/^requires_hermes: ">=\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/v\1/p' plugin.yaml)
            if [ -z "$floor" ]; then
              echo "::warning::plugin.yaml names no requires_hermes floor of the form \">=X.Y.Z\""
            else
              echo "hermes-agent floor release: $floor"
            fi
            matrix=$(jq -cn --arg tag "$latest" --arg floor "$floor" \
              '{include: ([{ref: "main", leg: "main"}, {ref: $tag, leg: "latest release"}]
                          + (if $floor != "" and $floor == $tag then [] else [{ref: $floor, leg: "floor"}] end))}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  suite:
    name: Suite vs hermes-agent ${{ matrix.ref || 'unresolved' }} (${{ matrix.leg }})
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    env:
      HERMES_REF: ${{ matrix.ref }}
    steps:
      - name: A ref to test
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ -z "$HERMES_REF" ]; then
            echo "::error::the $LEG hermes-agent ref could not be resolved (see the refs job)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.13"

      - name: Hermes as its own CI installs it (uv.lock, Python 3.14, mcp extra)
        id: hermes
        working-directory: hermes-agent
        run: |
          set -euo pipefail
          git log -1 --format='hermes-agent %H %cd'
          uv sync --locked --python 3.14 --extra mcp

      - name: Add this package to Hermes' environment
        run: uv pip install --python hermes-agent/.venv/bin/python -e "./plugin[dev]"

      - name: Lint (ruff)
        working-directory: plugin
        run: ../hermes-agent/.venv/bin/ruff check .

      - name: Type-check (mypy)
        working-directory: plugin
        run: ../hermes-agent/.venv/bin/mypy agentchatme_hermes

      - name: Test (pytest, with Hermes installed)
        working-directory: plugin
        env:
          # Never the runner's real home: every test that needs a profile home
          # sets its own; this catches one that forgets.
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME"
          ../hermes-agent/.venv/bin/python -m pytest -ra
          ../hermes-agent/.venv/bin/python -m pytest -ra -q tests/test_hermes_contract.py \
            | tee "$RUNNER_TEMP/contract.txt"
          if grep -q "skipped" "$RUNNER_TEMP/contract.txt" && ! grep -q "passed" "$RUNNER_TEMP/contract.txt"; then
            echo "::error::the Hermes contract tests were skipped — Hermes did not import"
            exit 1
          fi

      # The tree `hermes plugins install agentchatme/agentchat-hermes` clones:
      # the tracked files of this commit (git archive), nothing the steps above
      # wrote into the checkout.
      - name: Hermes' install scan of this plugin (as hermes plugins install runs it)
        if: ${{ !cancelled() && steps.hermes.outcome == 'success' }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/scan/agentchat"
          mkdir -p "$tree"
          git -C plugin archive --format=tar HEAD | tar -x -C "$tree"
          hermes-agent/.venv/bin/python plugin/.github/scripts/hermes-install-scan.py \
            plugin "$tree" https://github.com/agentchatme/agentchat-hermes.git

      - name: Hermes' skill-install scan of the served manual (as hermes skills install runs it)
        if: ${{ !cancelled() && steps.hermes.outcome == 'success' }}
        run: |
          set -euo pipefail
          skill="$RUNNER_TEMP/served-manual/agentchat"
          mkdir -p "$skill"
          curl -sS --fail --max-time 30 -o "$skill/SKILL.md" https://agentchat.me/skill.md
          sed -n 's/^version: //p' "$skill/SKILL.md" | head -1 | sed 's/^/served manual version: /'
          sha256sum "$skill/SKILL.md"
          hermes-agent/.venv/bin/python plugin/.github/scripts/hermes-install-scan.py \
            skill "$skill" https://agentchat.me/skill.md

  report:
    name: Open, update or close the nightly issue
    needs: [refs, suite]
    # Also after a failed or timed-out leg; never for a run that was itself
    # cancelled (a newer run in the concurrency group superseded it).
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report_issue) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFS_RESULT: ${{ needs.refs.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: bash .github/scripts/nightly-issue.sh

  notify-failure:
    needs: [refs, suite]
    if: ${{ !cancelled() && github.event_name == 'schedule' && (needs.refs.result != 'success' || needs.suite.result != 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WARNING }}
          TEXT: ":warning: *agentchatme-hermes nightly vs hermes-agent failed* (main, the latest release or the floor) — see the nightly issue: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::SLACK_WEBHOOK_WARNING not set — skipped (the nightly issue carries the alert)"; exit 0; fi
          printf '%s' "$TEXT" | jq -Rs '{text: .}' | curl -sS -o /dev/null --max-time 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
